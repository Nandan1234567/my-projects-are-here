<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Stylish Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="uiverse-pixel-card">

          Status:
          <span class="status">IN PROGRESS</span>

      </div>
    </div>
  </body>
</html>
